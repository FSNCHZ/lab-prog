<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Barrios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/form-barrio.css">
</head>
<body>
    <header>
        <div class="header text-center py-3 mb-4">
            <h1 class="h3 mb-2 text-dark">Agregar Barrio</h1>
            <nav>
                <div class="d-flex justify-content-center gap-4">
                    <a href="/index">Menú Principal</a>
                    <a href="/viviendas">Viviendas</a>
                </div>
            </nav>
        </div>
    </header>
    <main>
        <div class="d-flex container-fluid justify-content-center align-items-center">
            <div class="row w-75">
                <div class="col-lg-6 col-md-6 col-sm-6 p-4 container justify-content-center card">
                        <div class="d-flex justify-content-end">
                            <button class="btn btn-volver"><a href="/barrios">X</a></button>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/barrios}" th:object="${barrio}" method="POST">
                                <div class="form-group mb-1">
                                    <label>Nombre</label>
                                    <input type="text" name="nombre" th:field="*{nombre}" class="form-control mt-3" placeholder="Ingrese el nombre del barrio" required>
                                </div>
                                <div class="d-flex box-footer mt-4 justify-content-center">
                                    <button class="btn btn-guardar">Guardar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="mt-5 py-3 bg-white border-top">
        <div class="container text-center text-muted small">
            TP6 - Sánchez Francisco
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
