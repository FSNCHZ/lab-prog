<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <header>
        <div class="container-fluid border py-3 text-center">
            <h2>Menú Principal</h2>
        </div>
    </header>
    <main>
        <div class="d-flex container-fluid my-4 justify-content-center">
            <div class="card mx-5" style="width: 18rem;">
                <img src="./img/login.png" class="card-img-top" alt="login">
                <div class="card-body">
                    <h5 class="card-title">Formulario de Registro</h5>
                    <p class="card-text">Registrate en unos simples pasos</p>
                    <a href="./form.html" class="btn btn-primary w-100">Ir al formulario</a>
                </div>
            </div>
            <div class="card mx-5" style="width: 18rem;">
                <img src="./img/planificacion.jpg" class="card-img-top" alt="planificacion">
                <div class="card-body">
                    <h5 class="card-title">Planificación diaria</h5>
                    <p class="card-text">Planifica tus actividades</p>
                    <a href="./planificacion-fluid.html" class="btn btn-primary w-100">Ir a planificación diaria</a>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container-fluid border pt-2 text-center">
            <p>TP5 - Sánchez Francisco</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
