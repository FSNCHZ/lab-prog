<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container-fluid w-75 my-4 py-4 px-4 border rounded">
        <header>
            <div class="text-center mb-4">
                <h3>Formulario de Registro</h3>
            </div>
        </header>
        <main>
            <div class="alert alert-success">
                Usted está a punto de registrarse
            </div>
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre Completo</label>
                <input type="text" class="form-control" id="nombre" placeholder="Escribe tu nombre completo">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="ejemplo@dominio.com">
            </div>
            <div class="mb-3"">
                <label for="contraseña">Contraseña</label>
                <input type="password" class="form-control" id="contraseña" placeholder="Crea una contraseña">
            </div>
            <div class="mb-3">
                <label for="confirm-contraseña" class="form-label">Confirmar Contraseña</label>
                <input type="password" class="form-control" id="confirm-contraseña" placeholder="Repite tu contraseña">
            </div>
            <div class="mb-3">
                <p>Género</p>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="radioDefault" id="masculino">
                    <label for="masculino">Masculino</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="radioDefault" id="femenino">
                    <label for="femenino">Femenino</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="radioDefault" id="otro">
                    <label for="otro">Otro</label>
                </div>
            </div>
            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                    <label class="form-check-label" for="checkDefault">Acepto los <a href="./term.html">Términos y Condiciones</a></label>
                </div>
            </div>
            <div class="mb-3">
                <label for="pais"></label>
                <select class="form-select" id="pais" aria-label="Selecciona tu país">
                    <option selected>Selecciona tu país</option>
                    <option value="arg">Argentina</option>
                    <option value="chile">Chile</option>
                    <option value="uru">Uruguay</option>
                    <option value="bol">Bolivia</option>
                    <option value="par">Paraguay</option>
                    <option value="per">Perú</option>
                </select>
            </div>
            <div class="mb-3">
                <div>
                    <button class="btn btn-primary w-100" type="submit">Registrar</button>
                </div>
            </div>
        </main>
    </div>
    <footer>
        <div class="container-fluid border text-center">
            <p>TP5 - Sánchez Francisco</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
