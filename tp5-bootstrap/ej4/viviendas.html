<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Viviendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <header>
        <div class="container-fluid nav bg-secondary text-white p-3 justify-content-center">
            <h2>Gestor de Viviendas</h2>
        </div>
    </header>
    <main>
        <div class="container-fluid my-4 p-4">
            <form class="form container w-50 bg-primary-subtle border rounded mb-4 p-4 justify-content-center">
                <h3 class="text-center mb-3">Formulario de viviendas</h3>
                <div class="row">
                    <div class="mb-3 col-sm-12 col-lg-6">
                        <label for="id-vivienda" class="form-label">ID</label>
                        <input type="text" name="id-vivienda" id="id-vivienda" class="form-control" placeholder="Ingrese el ID de la vivienda">
                    </div>
                    <div class="mb-3 col-sm-12 col-lg-6">
                        <label for="calle" class="form-label">Calle</label>
                        <input type="text" name="calle" id="calle" class="form-control" placeholder="Ingrese el nombre de la calle">
                    </div>
                </div>
                <div class="row">
                    <div class="mb-3 col-sm-12 col-lg-4">
                        <label for="numero" class="form-label">Número</label>
                        <input type="number" name="numero" id="numero" class="form-control" placeholder="Ingrese el n° de la vivienda">
                    </div>
                    <div class="mb-3 col-sm-12 col-lg-4">
                        <label for="titular" class="form-label">Titular</label>
                        <input type="text" name="titular" id="titular" class="form-control" placeholder="Ingrese el nombre del titular">
                    </div>
                    <div class="mb-3 col-sm-12 col-lg-4">
                        <label for="habitantes" class="form-label">Habitantes</label>
                        <input type="number" name="habitantes" id="habitantes" class="form-control" placeholder="Ingrese el n° de habitantes">
                    </div>
                </div>
                <div class="row">
                    <div class="mb-3">
                        <p>Barrio</p>
                        <select class="form-select" name="barrio" id="barrio">
                            <option selected>Seleccione un barrio</option>
                            <option value="belgrano">Belgrano</option>
                            <option value="evita">Evita</option>
                            <option value="centro">Centro</option>
                            <option value="dos-abril">2 de Abril</option>
                            <option value="fatima">Fatima</option>
                            <option value="docente">Docente</option>
                            <option value="procear">Procrear</option>
                        </select>
                    </div>
                </div>
                <div class="container-fluid d-flex justify-content-center">
                    <button type="submit" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">Añadir</button>
                </div>
            </form>
            <div class="container overflow-hidden viviendas">
                <div class="row p-4 g-4">

                </div>
            </div>
        </div>
        <!--Modal-->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel"></h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container-fluid bg-secondary text-white p-1 text-center">
            <p>TP5 - Sánchez Francisco</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./js/viviendas.js"></script>
</body>
</html>
